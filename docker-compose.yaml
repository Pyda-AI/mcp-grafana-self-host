services:
  grafana-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grafana-mcp-server
    ports:
      - "${MCP_SERVER_PORT:-8443}:${MCP_SERVER_PORT:-8443}"
    environment:
      # Point to customer's existing Grafana instance
      - GRAFANA_URL=${GRAFANA_URL:-http://localhost:3000}
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_SERVICE_ACCOUNT_TOKEN}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_SERVER_PORT=${MCP_SERVER_PORT:-8443}
      - MCP_LOG_LEVEL=${MCP_LOG_LEVEL:-info}
      - GRAFANA_ORG_ID=${GRAFANA_ORG_ID:-}
      # TLS paths inside container (where Go app will look for files)
      - MCP_TLS_CERT_FILE=${MCP_TLS_CERT_FILE}
      - MCP_TLS_KEY_FILE=${MCP_TLS_KEY_FILE}
      - MCP_TLS_CA_FILE=${MCP_TLS_CA_FILE}
      - MCP_TLS_SKIP_VERIFY=${MCP_TLS_SKIP_VERIFY:-false}
      - MCP_SERVER_TLS_CERT_FILE=${MCP_SERVER_TLS_CERT_FILE}
      - MCP_SERVER_TLS_KEY_FILE=${MCP_SERVER_TLS_KEY_FILE}
    volumes:
      - type: bind
        source: ${MCP_TLS_CERT_FILE:-/dev/null}
        target: ${MCP_TLS_CERT_FILE:-/tmp/mcp-tls-cert}
        read_only: true
      - type: bind
        source: ${MCP_TLS_KEY_FILE:-/dev/null}
        target: ${MCP_TLS_KEY_FILE:-/tmp/mcp-tls-key}
        read_only: true
      - type: bind
        source: ${MCP_TLS_CA_FILE:-/dev/null}
        target: ${MCP_TLS_CA_FILE:-/tmp/mcp-tls-ca}
        read_only: true
      - type: bind
        source: ${MCP_SERVER_TLS_CERT_FILE:-/dev/null}
        target: ${MCP_SERVER_TLS_CERT_FILE:-/tmp/mcp-server-cert}
        read_only: true
      - type: bind
        source: ${MCP_SERVER_TLS_KEY_FILE:-/dev/null}
        target: ${MCP_SERVER_TLS_KEY_FILE:-/tmp/mcp-server-key}
        read_only: true
    restart: unless-stopped
